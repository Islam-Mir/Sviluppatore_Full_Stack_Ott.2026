<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spinner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="stylePedro.css">
</head>
<body>
    
        <!--contenitore-->
    <div class="container text-center d-flex flex-column justify-content-center align-items-center vh-100 ">
        <!--titolo-->
        <h2 class="text-center mt-4">Pedro Spinner</h2>
        <!--immagine-->
        <div class="rotondo">
            <img id="immagine" src="./src/pedro_vespa_.jpg" alt="">
        </div>
        <!--Bottoni-->
        <div class="mt-4 d-flex gap-4">
            <!--Start Button-->
            <button id="startBtn" class="btn btn-success">
                
                <span id="spinner" role="status" class="spinner-border spinner-border-sm text-dark d-none"></span>
                
                
                ▶️Start</button>
            <!--Stop Button-->
            <button id="stopBtn" class="btn btn-danger">⏹️Stop</button>
        </div>
        <!--import della canzone-->
        <audio id="musica" src="./music/msic.mp3"></audio>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="mainPedro.js"></script>
</body>
</html>

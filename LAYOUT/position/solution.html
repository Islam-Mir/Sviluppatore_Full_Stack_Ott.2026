<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soluzione</title>

    <style>

        *{
            box-sizing: border-box;
        }

        body {

            margin: 0;
        }


        .container{

            width: 100%;
            height: 70vh;
            background-color: green;
            position: relative;
        }


        .blu{
            width: 30%;
            height: 60%;
            background-color: blue;
            position: absolute;
            border: 2px solid black;
        }


        .blu1{

            top: 1%;

        }

        .blu2{

            top: 1%;
            left: 30%;
        }


        .rosso{
            width: 8%;
            height: 8%;
            background-color: red;
            position: absolute;
            border: 2px solid black;
        }

        .rosso1{

            top: 2%;
            left: 2%;

        }

        .rosso2{

            top: 20%;
            left: 22%
        }

        .rosso3{

            top: 2%;
            left: 35%;

        }

        .rosso4{

            
            top: 10%;
            left: 28%;

        }




    </style>




</head>
<body>




    <div class="container">

        <!--Rettangoli blu-->

        <div class="blu blu1"></div>
        <div class="blu blu2"></div>


        <!--Rettangoli rossi-->
        <div class="rosso rosso1"></div>
        <div class="rosso rosso2"></div>
        <div class="rosso rosso3"></div>
        <div class="rosso rosso4"></div>


    </div>








    
</body>
</html>
